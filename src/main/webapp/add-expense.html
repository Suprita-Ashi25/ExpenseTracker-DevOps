<!DOCTYPE html>
<html>

<head>

    <title>Add Expense</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .container {
            width: 400px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            margin: 8px 0 18px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #333;
            color: white;
            border: none;
            cursor: pointer;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Add Expense</h1>

    <form action="add-expense" method="post">

        <label>Expense Name</label>

        <input
            type="text"
            id="expenseName"
            name="expenseName"
            required
        >

        <label>Amount</label>

        <input
            type="number"
            id="amount"
            name="amount"
            step="0.01"
            required
        >

        <label>Category</label>

        <select
            id="category"
            name="category">

            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Education">Education</option>
            <option value="Shopping">Shopping</option>
            <option value="Other">Other</option>

        </select>

        <label>Date</label>

        <input
            type="date"
            id="date"
            name="date"
            required
        >

        <button
            type="submit"
            id="addExpenseButton">
            Add Expense
        </button>

    </form>

</div>

</body>

</html>
